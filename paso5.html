<!DOCTYPE html>

<html class="light" lang="es"><head>

<script id="tailwind-config">

        darkMode: "class",

                    "tertiary-fixed": "#ffdbce",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#c2ebe3",

                    "on-secondary-container": "#456b66",
                    "inverse-primary": "#6bd8cb",

                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",

                    "secondary": "#3f6560",
                    "error": "#ba1a1a",
                    "surface-container": "#e5eeff",

                    "on-tertiary-container": "#fffbff",
                    "on-tertiary-fixed": "#370e00",
                    "background": "#f8f9ff",
                    "on-primary": "#ffffff",
                    "tertiary": "#924628",
                    "on-secondary-fixed-variant": "#274d48",
                    "on-secondary-fixed": "#00201d"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- Top Navigation Anchor (Manual Implementation based on TopAppBar JSON logic) -->
<header class="flex flex-col items-start w-full pt-4 px-6 gap-4 bg-white dark:bg-[#121c28]">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#00685f] dark:text-[#0D9488]" data-icon="arrow_back">arrow_back</span>
<span class="font-['Inter'] font-semibold tracking-tight text-sm text-slate-400">Onboarding Progress</span>
</div>
<button class="text-on-surface-variant font-medium text-sm">Salir</button>
</div>
<!-- 5-Segment Progress Bar -->
<div class="flex w-full gap-2 mb-2">
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-gradient-to-r from-[#00685f] to-[#008378] relative overflow-hidden">
<div class="absolute inset-0 flex items-center justify-end pr-1">
<span class="material-symbols-outlined text-[10px] text-white" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
</header>
<main class="max-w-md w-full px-6 pt-12 pb-32 flex flex-col items-center text-center">
<!-- Success Icon Section -->
<div class="mb-8 relative">
<div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="absolute -top-2 -right-2 text-2xl">🎉</div>
</div>
<!-- Headline Section -->
<div class="space-y-2 mb-10">
<h1 class="text-[26px] font-extrabold leading-tight text-on-surface tracking-tight">¡Tu menú está listo!</h1>
<p class="text-[16px] text-on-surface-variant">Compártelo con tus clientes</p>
</div>
<!-- QR Preview Card (Atmospheric Depth) -->
<div class="bg-surface-container-lowest rounded-[24px] p-8 mb-12 shadow-[0_8px_32px_rgba(0,104,95,0.06)] flex flex-col items-center border border-surface-container-highest/20">
<div class="bg-white p-4 rounded-xl shadow-inner mb-4">
<img alt="QR Code" class="w-[200px] h-[200px]" data-alt="A clean high-resolution QR code centered on a white minimalist background, sharp edges and professional look" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzktAk-e_1p1nwnGiW1d6AkYj1wvL4jeV2YMJmVixthB18NT0h_N9ZO43TYiCpKcsGu6Vv3Zrg1dKI1TJY4QdxsCMmaDo---WzJ07e-14YNYcvLfm0gRfuaPLUDRhIfgAPz03pIQiYmj2d6Ta8-BP7SDqoVQsvN2aHe730VB5PdpObraHmNghNnewEzA5Zq8g9b54TQiUKufM69s39wNMSm8z-20BJOFjqJbXoEkwGa6obunbjvEETw5LINddrcyktvNgkcCzkRg"/>
</div>
<p class="font-bold text-lg text-primary tracking-wide">Viva la Pasta</p>
<p class="text-xs text-on-surface-variant mt-1 uppercase tracking-widest font-medium">Digital Menu ID: 8824</p>
</div>
<!-- Action Buttons (Editorial Concierge Style) -->
<div class="w-full space-y-4">
<button class="w-full flex items-center justify-center gap-3 bg-gradient-to-b from-[#00685f] to-[#008378] h-[56px] rounded-xl text-white font-bold text-base uppercase tracking-wider shadow-lg hover:brightness-110 active:scale-[0.98] transition-all duration-200">
<span class="material-symbols-outlined text-xl" data-icon="content_copy">content_copy</span>
                Copiar link del menú
            </button>
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-lowest border-2 border-[#0D9488] h-[56px] rounded-xl text-[#0D9488] font-bold text-base uppercase tracking-wider hover:bg-teal-50 active:scale-[0.98] transition-all duration-200">
<span class="material-symbols-outlined text-xl" data-icon="download">download</span>
                Descargar QR
            </button>
<button class="w-full flex items-center justify-center gap-3 bg-[#25D366] h-[56px] rounded-xl text-white font-bold text-base uppercase tracking-wider shadow-md hover:brightness-105 active:scale-[0.98] transition-all duration-200">
<span class="material-symbols-outlined text-xl" data-icon="share">share</span>
                Compartir por WhatsApp
            </button>
</div>
<!-- Footer Link -->
<a class="mt-12 text-primary font-semibold flex items-center gap-2 hover:underline" href="#">
            Ir a editar mi menú
            <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</a>
</main>
<!-- Bottom Navigation Component (Manual Implementation based on BottomNavBar JSON logic) -->
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-center items-center bg-transparent backdrop-blur-xl px-6 pb-8">
<button class="flex items-center justify-center bg-gradient-to-b from-[#00685f] to-[#008378] h-[56px] w-full max-w-md rounded-xl text-white shadow-[0_-4px_24px_rgba(0,104,95,0.04)] font-['Inter'] font-bold text-base uppercase tracking-wider hover:brightness-110 active:scale-[0.98] transition-all duration-200">
<span>Continuar</span>
<span class="material-symbols-outlined ml-2" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</body></html>
