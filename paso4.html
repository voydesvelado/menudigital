<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#eaf1ff",
                    "surface-container-low": "#eef4ff",
                    "surface-dim": "#d1dbec",
                    "on-background": "#121c28",
                    "outline-variant": "#bcc9c6",
                    "on-error": "#ffffff",
                    "on-surface": "#121c28",
                    "primary-container": "#008378",
                    "surface-variant": "#d9e3f4",
                    "primary": "#00685f",
                    "on-primary-fixed": "#00201d",
                    "tertiary-fixed": "#ffdbce",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#c2ebe3",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#456b66",
                    "inverse-primary": "#6bd8cb",
                    "on-primary-container": "#f4fffc",
                    "surface-bright": "#f8f9ff",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#773215",
                    "on-surface-variant": "#3d4947",
                    "secondary": "#3f6560",
                    "error": "#ba1a1a",
                    "surface-container": "#e5eeff",
                    "surface": "#f8f9ff",
                    "inverse-surface": "#27313e",
                    "surface-tint": "#006a61",
                    "surface-container-highest": "#d9e3f4",
                    "primary-fixed-dim": "#6bd8cb",
                    "tertiary-fixed-dim": "#ffb59a",
                    "secondary-container": "#c2ebe3",
                    "on-primary-fixed-variant": "#005049",
                    "surface-container-high": "#dfe9fa",
                    "tertiary-container": "#b05e3d",
                    "secondary-fixed-dim": "#a6cfc8",
                    "outline": "#6d7a77",
                    "on-error-container": "#93000a",
                    "primary-fixed": "#89f5e7",
                    "on-tertiary-container": "#fffbff",
                    "on-tertiary-fixed": "#370e00",
                    "background": "#f8f9ff",
                    "on-primary": "#ffffff",
                    "tertiary": "#924628",
                    "on-secondary-fixed-variant": "#274d48",
                    "on-secondary-fixed": "#00201d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col">
<header class="bg-white dark:bg-[#121c28] flex flex-col items-start w-full pt-4 px-6 gap-4 docked full-width top-0 z-40">
<div class="flex items-center justify-between w-full">
<button class="text-[#00685f] dark:text-[#0D9488] Active: scale-95 transition-transform hover:bg-teal-50 dark:hover:bg-teal-900/20 p-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-['Inter'] font-semibold tracking-tight text-sm text-[#00685f]">Onboarding Progress</span>
<div class="w-10"></div>
</div>
<div class="w-full flex gap-2 mb-2">
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-primary"></div>
<div class="h-2 flex-1 rounded-full bg-gradient-to-r from-primary to-primary-container"></div>
<div class="h-2 flex-1 rounded-full bg-surface-container-highest"></div>
</div>
</header>
<main class="flex-1 px-6 pt-8 pb-32 max-w-2xl mx-auto w-full">
<section class="mb-8">
<h1 class="text-[22px] font-bold text-on-surface tracking-tight leading-tight mb-2">Ahora agrega tus platillos</h1>
<p class="text-[15px] text-on-surface-variant leading-relaxed">Empieza con los más populares para atraer a tus primeros clientes.</p>
</section>
<nav class="flex overflow-x-auto gap-3 pb-6 -mx-6 px-6 no-scrollbar">
<button class="whitespace-nowrap px-5 py-2.5 rounded-full bg-[#0D9488] text-white font-medium text-sm transition-all Active:scale-[0.98]">
                Todos
            </button>
<button class="whitespace-nowrap px-5 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-medium text-sm hover:bg-surface-container-highest transition-all">
                Entradas
            </button>
<button class="whitespace-nowrap px-5 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-medium text-sm hover:bg-surface-container-highest transition-all">
                Platos Fuertes
            </button>
<button class="whitespace-nowrap px-5 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-medium text-sm hover:bg-surface-container-highest transition-all">
                Postres
            </button>
<button class="whitespace-nowrap px-5 py-2.5 rounded-full bg-surface-container-low text-on-surface-variant font-medium text-sm hover:bg-surface-container-highest transition-all">
                Bebidas
            </button>
</nav>
<div class="space-y-6">
<div class="flex flex-col items-center justify-center py-12 px-8 bg-surface-container-lowest rounded-3xl border border-dashed border-outline-variant/50">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-outline text-4xl" style="font-variation-settings: 'FILL' 0;">restaurant</span>
</div>
<h3 class="text-on-surface font-semibold text-lg mb-1">Aún no hay platillos...</h3>
<p class="text-on-surface-variant text-sm text-center mb-6">Tu menú está esperando su primera creación.</p>
<button class="flex items-center gap-2 px-6 py-3 rounded-xl border-2 border-primary text-primary font-bold text-sm hover:bg-primary/5 transition-colors">
<span class="material-symbols-outlined text-sm">add</span>
                    Agregar primer platillo
                </button>
</div>
<div class="bg-surface-container-lowest rounded-3xl p-6 shadow-sm border border-surface-container-low">
<div class="flex justify-between items-center mb-6">
<h4 class="font-bold text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-xl">edit_note</span>
                        Nuevo Platillo
                    </h4>
<button class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<form class="space-y-5">
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Nombre del platillo</label>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-4 focus:ring-2 focus:ring-primary text-on-surface placeholder:text-outline/50 transition-all" placeholder="Ej. Tacos de Pastor Especiales" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Precio</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface font-medium">$</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-8 pr-4 focus:ring-2 focus:ring-primary text-on-surface placeholder:text-outline/50 transition-all" placeholder="0.00" type="number"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1">Descripción</label>
<textarea class="w-full bg-surface-container-low border-none rounded-xl py-4 px-4 focus:ring-2 focus:ring-primary text-on-surface placeholder:text-outline/50 transition-all resize-none" placeholder="Describe los ingredientes, alérgenos o porción..." rows="3"></textarea>
</div>
<div class="pt-4 flex gap-3">
<button class="flex-1 py-4 px-6 rounded-xl bg-surface-container-highest text-on-surface-variant font-bold text-sm hover:brightness-95 transition-all Active:scale-95" type="button">
                            Cancelar
                        </button>
<button class="flex-[2] py-4 px-6 rounded-xl bg-gradient-to-b from-primary to-primary-container text-white font-bold text-sm shadow-lg shadow-primary/20 hover:brightness-110 transition-all Active:scale-95" type="submit">
                            Guardar Platillo
                        </button>
</div>
</form>
</div>
<button class="w-full py-5 rounded-3xl border-2 border-dashed border-outline-variant hover:border-primary hover:bg-primary/5 transition-all group flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">add_circle</span>
<span class="font-bold text-on-surface-variant group-hover:text-primary transition-colors">+ Agregar otro platillo</span>
</button>
</div>
</main>
<footer class="fixed bottom-0 left-0 w-full z-50 flex flex-col justify-center items-center bg-transparent backdrop-blur-xl px-6 pb-8">
<div class="mb-4 text-center">
<p class="text-xs font-medium text-on-surface-variant/80">Puedes agregar más platillos después</p>
</div>
<button class="flex items-center justify-center bg-gradient-to-b from-[#00685f] to-[#008378] h-[56px] w-full max-w-2xl rounded-xl text-white shadow-lg shadow-[#00685f]/20 font-['Inter'] font-bold text-base uppercase tracking-wider hover:brightness-110 Active:scale-[0.98] transition-all duration-200">
<span>Continuar</span>
<span class="material-symbols-outlined ml-2">chevron_right</span>
</button>
</footer>
<div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-primary-container z-[60]"></div>
</body></html>
