<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - Nombre del Negocio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#eaf1ff",
                    "surface-container-low": "#eef4ff",
                    "surface-dim": "#d1dbec",
                    "on-background": "#121c28",
                    "outline-variant": "#bcc9c6",
                    "on-error": "#ffffff",
                    "on-surface": "#121c28",
                    "primary-container": "#008378",
                    "surface-variant": "#d9e3f4",
                    "primary": "#00685f",
                    "on-primary-fixed": "#00201d",
                    "tertiary-fixed": "#ffdbce",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#c2ebe3",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#456b66",
                    "inverse-primary": "#6bd8cb",
                    "on-primary-container": "#f4fffc",
                    "surface-bright": "#f8f9ff",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#773215",
                    "on-surface-variant": "#3d4947",
                    "secondary": "#3f6560",
                    "error": "#ba1a1a",
                    "surface-container": "#e5eeff",
                    "surface": "#f8f9ff",
                    "inverse-surface": "#27313e",
                    "surface-tint": "#006a61",
                    "surface-container-highest": "#d9e3f4",
                    "primary-fixed-dim": "#6bd8cb",
                    "tertiary-fixed-dim": "#ffb59a",
                    "secondary-container": "#c2ebe3",
                    "on-primary-fixed-variant": "#005049",
                    "surface-container-high": "#dfe9fa",
                    "tertiary-container": "#b05e3d",
                    "secondary-fixed-dim": "#a6cfc8",
                    "outline": "#6d7a77",
                    "on-error-container": "#93000a",
                    "primary-fixed": "#89f5e7",
                    "on-tertiary-container": "#fffbff",
                    "on-tertiary-fixed": "#370e00",
                    "background": "#f8f9ff",
                    "on-primary": "#ffffff",
                    "tertiary": "#924628",
                    "on-secondary-fixed-variant": "#274d48",
                    "on-secondary-fixed": "#00201d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-white text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar Shell -->
<header class="flex flex-col items-start w-full pt-4 px-6 gap-4 docked full-width top-0 bg-white dark:bg-[#121c28] tonal-shift-via-surface-container-low">
<div class="flex items-center w-full justify-between">
<button class="text-[#00685f] dark:text-[#0D9488] hover:bg-teal-50 dark:hover:bg-teal-900/20 active:scale-95 transition-transform p-1 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-['Inter'] font-semibold tracking-tight text-sm text-[#00685f]">Onboarding Progress</span>
<div class="w-8"></div> <!-- Spacer for symmetry -->
</div>
<!-- 5-Segment Progress Bar -->
<div class="flex gap-2 w-full max-w-md mx-auto h-2 mb-2">
<div class="flex-1 rounded-full bg-gradient-to-r from-primary to-primary-container h-full"></div>
<div class="flex-1 rounded-full bg-surface-container-highest h-full"></div>
<div class="flex-1 rounded-full bg-surface-container-highest h-full"></div>
<div class="flex-1 rounded-full bg-surface-container-highest h-full"></div>
<div class="flex-1 rounded-full bg-surface-container-highest h-full"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-12 pb-24 max-w-2xl mx-auto w-full">
<!-- Hero Emoji Section -->
<div class="mb-10 flex flex-col items-center">
<div class="w-24 h-24 bg-surface-container-low rounded-full flex items-center justify-center text-5xl shadow-sm border border-outline-variant/10">
                🍽️
            </div>
</div>
<!-- Headline Group -->
<div class="text-center mb-12 space-y-3">
<h1 class="text-[24px] font-extrabold text-on-surface tracking-tight leading-tight">
                ¿Cómo se llama tu negocio?
            </h1>
<p class="text-[15px] text-on-surface-variant font-medium">
                Así aparecerá en tu menú digital
            </p>
</div>
<!-- Input Field Container -->
<div class="w-full space-y-4">
<div class="relative group">
<input autofocus="" class="w-full h-[56px] px-6 text-[18px] bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all outline-none text-on-surface placeholder:text-outline/60 shadow-sm" placeholder="Ej: Tacos Don Manuel" type="text"/>
<div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-primary/40 group-focus-within:text-primary">
<span class="material-symbols-outlined" data-icon="storefront">storefront</span>
</div>
</div>
<!-- Contextual Card (Editorial Architecture) -->
<div class="bg-surface-container-low/50 p-5 rounded-xl mt-8 flex items-start gap-4">
<div class="p-2 bg-white rounded-lg text-primary shadow-sm">
<span class="material-symbols-outlined" data-icon="lightbulb">lightbulb</span>
</div>
<div class="space-y-1">
<h4 class="text-sm font-bold text-on-surface">Un buen nombre ayuda</h4>
<p class="text-xs text-on-surface-variant leading-relaxed">Los nombres cortos y memorables facilitan que tus clientes compartan tu menú en redes sociales.</p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-center items-center bg-transparent backdrop-blur-xl px-6 pb-8">
<button class="flex items-center justify-center bg-gradient-to-b from-[#00685f] to-[#008378] h-[56px] w-full max-w-md rounded-xl text-white shadow-lg hover:brightness-110 active:scale-[0.98] transition-all duration-200">
<span class="font-['Inter'] font-bold text-base uppercase tracking-wider">Continuar</span>
<span class="material-symbols-outlined ml-2" data-icon="chevron_right">chevron_right</span>
</button>
</nav>
<!-- Decorative Elements (Asymmetry) -->
<div class="fixed top-20 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-20 -left-20 w-48 h-48 bg-primary-container/5 rounded-full blur-3xl pointer-events-none"></div>
</body></html>
